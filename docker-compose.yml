services:
  mysql:
    image: mysql:8.4
    container_name: zeroone-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-zeroone_website}
      MYSQL_USER: ${MYSQL_USER:-zeroone_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - zeroone_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: zeroone-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-zeroone_website}
      DB_USER: ${MYSQL_USER:-zeroone_app}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REQUIRE_DB_ON_START: ${REQUIRE_DB_ON_START:-true}
      SYNC_DB_ON_START: ${SYNC_DB_ON_START:-true}
      SEQUELIZE_CLEAN_DUP_UNIQUE_INDEXES: ${SEQUELIZE_CLEAN_DUP_UNIQUE_INDEXES:-true}
      SEED_CHAT_ON_START: ${SEED_CHAT_ON_START:-true}
      SEED_ADMIN_ON_START: ${SEED_ADMIN_ON_START:-true}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      PASSWORD_SALT_ROUNDS: ${PASSWORD_SALT_ROUNDS:-12}
      ADMIN_NAME: ${ADMIN_NAME:-ZeroOne Admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MS_TENANT_ID: ${MS_TENANT_ID:-}
      MS_CLIENT_ID: ${MS_CLIENT_ID:-}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET:-}
      MS_SENDER_EMAIL: ${MS_SENDER_EMAIL:-info@zerooneitinc.com}
      MS_RECIPIENT_EMAIL: ${MS_RECIPIENT_EMAIL:-info@zerooneitinc.com}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
        REACT_APP_SITE_URL: ${REACT_APP_SITE_URL:-https://zerooneitinc.com}
        REACT_APP_CHAT_STORAGE_TTL_HOURS: ${REACT_APP_CHAT_STORAGE_TTL_HOURS:-24}
    container_name: zeroone-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${ZEROONE_WEB_BIND:-127.0.0.1}:${ZEROONE_WEB_PORT:-3100}:80"

volumes:
  zeroone_mysql_data:
