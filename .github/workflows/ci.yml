name: CI

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  verify:
    name: Verify app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test web
        run: npm run test:web

      - name: Build web
        run: npm run build:web
        env:
          REACT_APP_API_URL: /api
          REACT_APP_SITE_URL: https://zerooneitinc.com
          REACT_APP_CHAT_STORAGE_TTL_HOURS: 24

      - name: Check API syntax
        run: |
          node --check apps/api/src/server.js
          node --check apps/api/src/app.js
          node --check apps/api/src/config/database.js

      - name: Validate Docker Compose
        run: docker compose --env-file .env.docker.example config
